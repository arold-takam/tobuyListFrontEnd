<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TobuyList/Connectez-vous</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <a href="../html/landingPage.html" class="linkPage"><img src="../ressources/images/imgLogo.png" alt="logo icon"></a>
        <div class="authCta">
            <a href="../html/register.html" class="register">INSCRIPTION</a>
        </div>
    </header>
    <div class="main">
        <h1>ToBuyList</h1>
        <span class="description">Connectez-vous pour une meilleure gestion financière.</span>
        <section class="onboarding">
            <ul>
                <li class="activeSuccess">1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </ul>
            <div class="errorTracker">Aucune info détectée pour l'instant.</div>
        </section>
        <form class="loginForm">
            <div class="put">
                <label for="userName">Entrez votre nom d'utilisateur</label>
                <input type="text" name="userName" id="userName" class="userName">
            </div>
            <div class="put">
                <label for="pass">Entrez votre mot de pass</label>
                <input type="password" name="pass" id="pass" class="pass">
            </div>
            <button type="submit" class="send">SE CONNECTER</button>
            <a href="../html/transactionSuccess.html" style="color: white; font-size: larger;">SUCCESS</a>
        </form>
        <section class="meetUs">
            <div class="callZone">
                <h4>OU</h4>
                <a href="../html/register.html" class="register">Inscription</a>
            </div>
        </section>
        <footer>
            <p>&copy; Copyright 2025, TobuyList; Tout droits reservé.</p>
        </footer>
    </div>
</body>
</html>
